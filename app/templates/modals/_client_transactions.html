<!-- Forward to Office Modal -->
<div id="forwardModal" tabindex="-1" aria-hidden="true" class="hidden fixed inset-0 z-50 flex items-center justify-center w-full p-4 bg-black/50">
    <div class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-lg shadow-xl">
        <div class="flex items-center justify-between px-6 py-5 border-b border-gray-200 dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-10 rounded-t-xl">
            <div class="flex items-center gap-3">
                <span class="w-9 h-9 shrink-0 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4.248 19C3.22 15.77 5.275 8.232 12.466 8.232V6.079a1.025 1.025 0 0 1 1.644-.862l5.479 4.307a1.108 1.108 0 0 1 0 1.723l-5.48 4.307a1.026 1.026 0 0 1-1.643-.861v-2.154C5.275 13.616 4.248 19 4.248 19Z"/></svg>
                </span>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Forward Transaction</h3>
            </div>
            <button type="button" onclick="hideModal('forwardModal')"
                class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-300 rounded-lg w-8 h-8 flex items-center justify-center text-xl leading-none">&times;</button>
        </div>
        <form id="forwardForm" class="px-6 py-5 space-y-4" onsubmit="event.preventDefault(); saveForwardClient();">
            <input type="hidden" id="forwardQueueNo">
            <div class="flex items-center gap-3 bg-gray-50 dark:bg-gray-900/40 rounded-lg p-3">
                <span id="forwardQueueBadge" class="w-10 h-10 shrink-0 rounded-lg bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 flex items-center justify-center text-xs font-bold">P-014</span>
                <div class="min-w-0">
                    <p id="forwardClientFullName" class="text-sm font-medium text-gray-900 dark:text-white truncate"></p>
                    <p id="forwardClientTransaction" class="text-xs text-gray-500 dark:text-gray-400">New application</p>
                </div>
            </div>
            <div class="relative">

    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Organization Name
        <span class="text-gray-400 font-normal">(optional)</span>
    </label>

    <input
        id="forwardOrgName"
        type="text"
        autocomplete="off"
        placeholder="Search organization..."
        class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
    >

    <input
        type="hidden"
        id="forwardOrgId"
    >

        <div
            id="organizationSuggestions"
            class="hidden absolute left-0 right-0 z-50 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg max-h-48 overflow-y-auto"
        ></div>

        <button
            type="button"
            id="addOrganizationBtn"
            onclick="addNewOrganization()"
            class="hidden mt-2 text-sm text-blue-600 hover:text-blue-800 dark:text-blue-400 font-medium"
        >
            + Add Organization
        </button>

    </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Division</label>
                    <select id="forwardDivision" required onchange="onForwardDivisionChange()"
                        class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                        <option value="" disabled selected>Select division</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Unit</label>
                    <select id="forwardUnit" required disabled
                        class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600 disabled:opacity-60 disabled:cursor-not-allowed">
                        <option value="" disabled selected>Select division first</option>
                    </select>
                </div>
            </div>
            <select id="forwardClientTransactionType" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                <option>Submit Documents</option>
                <option>Request</option>
                <option>Claiming of Documents</option>
                <option>Inquiry</option>
                <option>Other</option>
            </select>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Transactions Details <span class="text-gray-400 font-normal">(optional)</span></label>
                <textarea id="forwardTransactionDetails" required rows="3" placeholder="Reason for forwarding, missing requirements, etc."
                    class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"></textarea>
            </div>
            <div class="flex gap-3 pt-1">
                <button type="button" onclick="hideModal('forwardModal')" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700">Cancel</button>
                <button type="submit" class="flex-1 py-2.5 rounded-lg bg-cyan-700 text-white text-sm font-medium hover:bg-cyan-800">Forward</button>
            </div>
        </form>
    </div>
</div>


<!-- Serve Transaction Modal -->
<div id="serveModal" tabindex="-1" aria-hidden="true" class="hidden fixed inset-0 z-50 flex items-center justify-center w-full p-4 bg-black/50">
    <div class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-6 py-5 border-b border-gray-200 dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-10 rounded-t-xl">
            <div class="flex items-center gap-3">
                <span class="w-9 h-9 shrink-0 rounded-lg bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                </span>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">Serve transaction</h3>
            </div>
            <button type="button" onclick="hideModal('serveModal')"
                class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-300 rounded-lg w-8 h-8 flex items-center justify-center text-xl leading-none">&times;</button>
        </div>
        <form id="serveForm" class="px-6 py-5 space-y-5" onsubmit="event.preventDefault(); saveServeClient();">
            <input type="hidden" id="serveClientId">
            <input type="hidden" id="serveTransactionId">
 
            <div class="flex items-center gap-3 bg-gray-50 dark:bg-gray-900/40 rounded-lg p-3 border border-gray-100 dark:border-gray-700">
                <span id="serveQueueBadge" class="w-10 h-10 shrink-0 rounded-lg bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 flex items-center justify-center text-xs font-bold">P-014</span>
                <div class="min-w-0">
                    <p id="serveClientName" class="text-sm font-medium text-gray-900 dark:text-white truncate">Maria Santos</p>
                    <p id="serveClientTransaction" class="text-xs text-gray-500 dark:text-gray-400">New application</p>
                </div>
            </div>
            <div class="relative">
                <label for="serveOrgName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    Organization Name <span class="text-gray-400 font-normal">(optional)</span>
                </label>
                <input id="serveOrgName" type="text" autocomplete="off" placeholder="Search organization..."
                    class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                <input type="hidden" id="serveOrgId">
                <div id="serveOrganizationSuggestions"
                    class="hidden absolute left-0 right-0 z-50 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg max-h-48 overflow-y-auto"></div>
                <button type="button" id="addServeOrganizationBtn" onclick="addNewServeOrganization()"
                    class="hidden mt-2 text-sm text-blue-600 hover:text-blue-800 dark:text-blue-400 font-medium">
                    + Add Organization
                </button>
            </div>
            <div id="serveTransactionDetailsSection">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    Transaction Details <span class="text-gray-400 font-normal">(optional)</span>
                </label>

                <textarea
                    id="serveDetails"
                    rows="2"
                    placeholder="Notes about this transaction..."
                    class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"></textarea>
            </div>
            
            <!-- Q1: Citizen's Charter -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Is this transaction covered by the Citizen's Charter?</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveCharter" value="Yes" class="peer hidden" onchange="updateServeFlow()">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:border-teal-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">Yes</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveCharter" value="No" class="peer hidden" onchange="updateServeFlow()">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">No</div>
                    </label>
                </div>
            </div>
            
            <div id="serveTypeSelection" class="hidden">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Transaction Type <span class="text-gray-400 font-normal"></span></label>
                <select id="serveTransactionType" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
                    <option>Submit Documents</option>
                    <option>Request</option>
                    <option>Claiming of Documents</option>
                    <option>Inquiry</option>
                    <option>Other</option>
                </select>
            </div>
            
            <!-- Services (shown if Charter = Yes) — options are loaded dynamically from
                 api/services/available/, scoped to the logged-in user's division/unit. -->
            <div id="serveServiceSection" class="hidden border-t border-gray-100 dark:border-gray-700 pt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
                    Which service was availed?
                </label>

                <!-- Service dropdown -->
                <select
                    id="serveService"
                    class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                    onchange="updateServeFlow()"
                >
                    <option value="" selected disabled>Select service</option>
                </select>

                <!-- No Service Warning -->
                <div
                    id="serveNoServiceWarning"
                    class="hidden mt-2 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 dark:border-amber-800 dark:bg-amber-900/20"
                >
                    <div class="flex items-start gap-3">

                        <!-- Warning Icon -->
                        <div class="flex-shrink-0 text-amber-600 dark:text-amber-400">
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 9v4m0 4h.01M10.29 3.86l-7.5 13A2 2 0 004.52 20h14.96a2 2 0 001.73-3.14l-7.5-13a2 2 0 00-3.42 0Z"
                                />
                            </svg>
                        </div>

                        <!-- Warning Text -->
                        <div>
                            <p class="text-sm font-semibold text-amber-800 dark:text-amber-300">
                                No Services Available
                            </p>

                            <p class="mt-1 text-xs text-amber-700 dark:text-amber-400">
                                There are no services available for this unit under the Citizen's Charter.
                            </p>
                        </div>

                    </div>
                </div>

            </div>
 
            <!-- Q2: Deficiencies (shown once a service is selected) -->
            <div id="serveDeficiencyQuestion" class="hidden border-t border-gray-100 dark:border-gray-700 pt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Were there any deficiencies noted?</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveDeficiency" value="Yes" class="peer hidden" onchange="updateServeFlow()">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:border-teal-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">Yes</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveDeficiency" value="No" class="peer hidden" onchange="updateServeFlow()">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">No</div>
                    </label>
                </div>
            </div>
 
            <!-- Deficiency details input (shown if Yes) -->
            <div id="serveDeficiencyDetailsSection" class="hidden">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Where / what are the deficiencies?</label>
                <textarea id="serveDeficiencyDetails" rows="2" placeholder="e.g. Missing barangay ID, incomplete signature on form 2..."
                    class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500"></textarea>
            </div>
 
            <!-- Q3: Catered / Resolved -->
            <div id="serveResolvedQuestion" class="hidden border-t border-gray-100 dark:border-gray-700 pt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Was the transaction catered / resolved?</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveResolved" value="Yes" class="peer hidden" onchange="updateServeFlow()">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:border-teal-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">Yes</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveResolved" value="No" class="peer hidden" onchange="updateServeFlow()">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">No</div>
                    </label>
                </div>
            </div>
            <!-- Remarks — free-text note, separate from the transaction details above.
                 Use this for anything staff/sub-admin want to flag for the next person
                 handling this client (e.g. "client requested callback", "priority case"). -->
            <div id="serveRemarksSection" class="hidden">
                <div class="border-t border-gray-100 dark:border-gray-700 pt-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Remarks <span class="text-gray-400 font-normal">(optional)</span></label>
                    <textarea id="serveRemarks" rows="2" placeholder="Any additional notes for this transaction..."
                        class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-white rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"></textarea>
                </div>
            </div>
            
            <!-- survey form -->
            <!-- SURVEY FORM -->
            <div id="CSMForm" class="hidden border-t border-gray-100 dark:border-gray-700 pt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"> Survey Form </label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="serveForm" value="CSM" class="peer hidden">
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:border-teal-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">CSM</div>
                    </label>
                </div>
            </div>

            <div id="CSSForm" class="hidden border-t border-gray-100 dark:border-gray-700 pt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"> Survey Form </label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input
                            type="radio"
                            name="serveForm"
                            value="CSS"
                            class="peer hidden"
                            onchange="updateServeFlow()"
                        >
                        <div class="text-center px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium text-gray-600 dark:text-gray-300 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">CSS</div>
                    </label>
                </div>
            </div>
 
            <div id="serveButton" class="hidden">
                <div class="flex gap-3 pt-1">
                    <button type="button" onclick="hideModal('serveModal')" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700">Cancel</button>
                    <button type="submit" class="flex-1 py-2.5 rounded-lg bg-emerald-700 text-white text-sm font-medium hover:bg-emerald-800">Serve</button>
                </div>
            </div>
        </form>
    </div>
</div>
