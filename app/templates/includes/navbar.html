<script>
    (function () {
        function applyTheme(isDark) {
            const html = document.documentElement;
            const knob = document.getElementById('toggle-knob');
            const knobSun = document.getElementById('knob-sun');
            const knobMoon = document.getElementById('knob-moon');

            if (!knob || !knobSun || !knobMoon) return;

            html.classList.toggle('dark', isDark);
            knob.style.transform = isDark ? 'translateX(28px)' : 'translateX(0px)';
            knobSun.classList.toggle('hidden', isDark);
            knobMoon.classList.toggle('hidden', !isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDark = saved ? saved === 'dark' : prefersDark;

        applyTheme(isDark);

        const toggle = document.getElementById('theme-toggle');
        if (toggle) {
            toggle.addEventListener('click', function () {
                isDark = !isDark;
                applyTheme(isDark);
            });
        }
    })();

    (function () {
        const menuToggle = document.getElementById('user-menu-toggle');
        const dropdown = document.getElementById('user-menu-dropdown');
        const logoutBtn = document.getElementById('logout-btn');

        if (!menuToggle || !dropdown) return;

        function closeDropdown() {
            dropdown.classList.add('hidden');
            menuToggle.setAttribute('aria-expanded', 'false');
        }

        function openDropdown() {
            dropdown.classList.remove('hidden');
            menuToggle.setAttribute('aria-expanded', 'true');
        }

        menuToggle.addEventListener('click', function (e) {
            e.stopPropagation();
            dropdown.classList.contains('hidden') ? openDropdown() : closeDropdown();
        });

        document.addEventListener('click', function (e) {
            if (!dropdown.contains(e.target) && !menuToggle.contains(e.target)) {
                closeDropdown();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeDropdown();
        });

        if (logoutBtn) {
            logoutBtn.addEventListener('click', function () {
                window.location.href = "{% url 'logout_' %}";
            });
        }
    })();
</script>
