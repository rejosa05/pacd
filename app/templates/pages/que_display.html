{% extends "base.html" %}
{% load static %}
{% block title %} Display Board {% endblock %}
{% block content %}

<style>
    body {
        margin: 0;  
        background: #037a29;
        color: white;
    }

    /* HEADER */
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        background: #037a29;
    }
    .left {
        display: flex;
        align-items: center;   
    }

    .logo {
        height: 70px;
        width: auto;
    }

    .title {
        font-size: 2vw;
        font-weight: bold;
        margin-left: 10px;
    }

    .time {
        font-size: 2vw;
    }

    /* MAIN */
    .container {
        display: flex;
        height: 38vh;
    }

    /* LANES */
    .lane {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 0;
    }

    .priority { 
        background: #ffa8a8; 
        color: #ff1f1f;
        letter-spacing: 10px;
        font-weight: bolder;
    }
    .regular {
        background: #9dcbff; 
        color: #150df7;
        letter-spacing: 10px;
        font-weight: bolder;
    }

    .lane h2 {
        text-align: center;
        font-size: 2vw;
        color: #ffffff;
        margin: 0 0 5px 0;
    }

    .queue-number {
        text-align: center;
        font-size: 5vw;
        margin: 0;
        line-height: 1;
    }

    /* NEXT NUMBERS */
    .next-label {
        text-align: center;
        font-size: 1.1vw;
        letter-spacing: 4px;
        color: #ffffff;
        opacity: 0.85;
        margin-top: 14px;
    }

    .next-numbers {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
        letter-spacing: normal;
        flex-wrap: wrap;
        font-size: 2vw;
    }

    .next-numbers span {
        background-color: white;
        padding:  0 20px;
        opacity: 60%;
        border-radius: 5px;
    }

    .next-chip {
        background: rgba(255, 255, 255, 0.55);
        border-radius: 10px;
        padding: 6px 16px;
        font-size: 1.6vw;
        font-weight: bold;
    }

    .priority .next-chip {
        color: #ff1f1f;
    }

    .regular .next-chip {
        color: #150df7;
    }

    .next-chip.empty {
        opacity: 0.5;
        font-weight: normal;
        font-size: 1vw;
    }

    /* SERVING */
    .serving {
        background: #037a29;
        padding: 10px;
    }

    .serving h2 {
        text-align: center;
        font-size: 2vw;
        color: #f8f2f2;
    }

    .windows {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    /* CARD */
    .window-card {
        
        overflow: hidden;
    }

    /* HEADER (TITLE) */
    .window-header {
        background: #004d40;
        color: white;
        text-align: center;
        font-size: 1.5vw;
        font-weight: bold;
        padding: 10px;
    }

    /* BODY (QUEUE AREA) */
    .window-body {
        background: #3bfd79;
        padding: 5px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Container
    .client-card {
        margin: 10px 0;
    }

    /* Text */
    /* .queue-text {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2vw;
        font-weight: bold;
        color: #000000;
        gap: 20px;
    } */

    /* ICON STYLE */
    /* .queue-icon {
        font-size: 1.5vw;
        color: #ac0000;
        animation: popIn 0.3s ease;
    } */

    /* ANIMATION */
    @keyframes popIn {
        from {
            transform: scale(0.5);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* 📱 MOBILE / SMALL SCREEN */
    @media (max-width: 768px) {
        .container {
            height: auto;
        }
        .logo {
            height: 40px;
        }

        .container {
            flex-direction: column;
            height: auto;
        }
        .title { 
            font-size: 18px; 
        }
        .time { 
            font-size: 14px; 
        }

        .lane h2 {
             font-size: 18px; 
            }
        .queue-number { 
            font-size: 24px; 
        }
        .next-label {
            font-size: 12px;
        }
        .next-chip {
            font-size: 16px;
            padding: 4px 10px;
        }
        .windows {
            grid-template-columns: repeat(2, 1fr);
        }
        .window {
            font-size: 16px;
        }
    }
</style>

</head>
<body>

<div class="header">
    <div class="left">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
    <div class="title">DEPARTMENT OF HEALTH</div>
    </div>
    <div class="time" id="time"></div>
</div>

<div class="container">
    <div class="lane priority">
        <h2>PRIORITY LANE</h2>
        <div class="queue-number" id="fastCurrent">00</div>
        <div class="next-label">NEXT</div>
        <div class="next-numbers" id="fastNext"></div>
    </div>

    <div class="lane regular">
        <h2>REGULAR LANE</h2>
        <div class="queue-number" id="regularCurrent">00</div>
        <div class="next-label">NEXT</div>
        <div class="next-numbers" id="regularNext"></div>
    </div>
</div>

<div class="serving">
    <h2>NOW SERVING</h2>

    <div class="windows">

        <div class="window-card">
            <div class="window-header">RLED</div>
            <div class="window-body" id="RLED">
                <div class="clients-list"></div>
            </div>
        </div>

        <div class="window-card">
            <div class="window-header">MSD</div>
            <div class="window-body" id="MSD">
                <div class="clients-list"></div>
            </div>
        </div>

        <div class="window-card">
            <div class="window-header">LHSD</div>
            <div class="window-body" id="LHSD">
                <div class="clients-list"></div>
            </div>
        </div>

        <div class="window-card">
            <div class="window-header">RD/ARD</div>
            <div class="window-body" id="RD/ARD">
                <div class="clients-list"></div>
            </div>
        </div>

    </div>
</div>

{% load static %}
<script src="{% static 'js/main/que_display.js' %}"></script>

{% endblock %}
